[project]
name = "cad-translator"
version = "0.1.0"
description = "Cross-platform DWG and DXF text translator with translation memory and glossary support"
readme = "README.md"
license = "MIT"
authors = [{ name = "Ibrahim Garip" }]
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7,<7",
  "ezdxf>=1.3,<2",
  "httpx>=0.27,<1",
  "platformdirs>=4.2,<5",
]

[project.scripts]
cad-translator = "cad_translator.app:main"

[project.urls]
Repository = "https://github.com/ibrahmgarip/cad-translator"
Issues = "https://github.com/ibrahmgarip/cad-translator/issues"

[tool.setuptools.packages.find]
include = ["cad_translator*"]

[tool.pytest.ini_options]
pythonpath = ["."]
